# These folders hold fake keys and tokens on purpose (test fixtures and
# synthetic training data for the sensitive-data detector), so GitHub's
# secret scanner would flag them. Keep real secrets out of these folders.
paths-ignore:
  - "extension (2)/extension/secure_capture/ml_training/**"
  - "extension (2)/extension/secure_capture/testdata/**"
  - "extension (2)/extension/secure_capture/group2/tests/**"
  - "extension (2)/extension/secure_capture/group2/model/**"
